name: Production Database Backup

on:
  workflow_dispatch:

  schedule:
    # 12:00 AM Philippines time = 16:00 UTC
    - cron: "0 16 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      AWS_ENDPOINT_URL_S3: ${{ secrets.NEON_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.NEON_S3_REGION }}

      S3_BUCKET: database-backups

    steps:

      # ==========================================
      # 1. Install PostgreSQL 17 client
      # ==========================================
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            ca-certificates \
            postgresql-common

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<EOF
          Types: deb deb-src
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: $(dpkg --print-architecture)
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF

          sudo apt-get update

          sudo apt-get install -y postgresql-client-17


      # ==========================================
      # 2. Install AWS CLI v2
      # ==========================================
      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "awscliv2.zip"

          unzip -q awscliv2.zip

          sudo ./aws/install

          aws --version


      # ==========================================
      # 3. Check installed tools
      # ==========================================
      - name: Check tools
        run: |
          echo "=========================================="
          echo "PostgreSQL version"
          echo "=========================================="

          pg_dump --version

          echo ""
          echo "=========================================="
          echo "AWS CLI version"
          echo "=========================================="

          aws --version


      # ==========================================
      # 4. Check required secrets
      # ==========================================
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi

          if [ -z "$AWS_ENDPOINT_URL_S3" ]; then
            echo "ERROR: NEON_S3_ENDPOINT is not configured."
            exit 1
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "ERROR: NEON_S3_ACCESS_KEY_ID is not configured."
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: NEON_S3_SECRET_ACCESS_KEY is not configured."
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: NEON_S3_REGION is not configured."
            exit 1
          fi

          echo "All required configuration is present."


      # ==========================================
      # 5. Create database backup
      # ==========================================
      - name: Create database backup
        run: |
          mkdir -p backup

          BACKUP_FILE="backup/production-$(date -u +%Y-%m-%d).dump"

          echo "=========================================="
          echo "Creating database backup"
          echo "=========================================="

          echo "Output file:"
          echo "$BACKUP_FILE"

          pg_dump \
            --format=custom \
            --no-owner \
            --no-acl \
            "$DATABASE_URL" \
            --file="$BACKUP_FILE"

          echo ""
          echo "Database backup created successfully."


      # ==========================================
      # 6. Verify backup
      # ==========================================
      - name: Verify backup
        run: |
          echo "=========================================="
          echo "Verifying backup"
          echo "=========================================="

          ls -lh backup/

          BACKUP_FILE=$(find backup -name "*.dump" -type f | head -n 1)

          if [ -z "$BACKUP_FILE" ]; then
            echo "ERROR: Backup file was not created."
            exit 1
          fi

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "ERROR: Backup file is empty."
            exit 1
          fi

          echo ""
          echo "Backup file:"
          echo "$BACKUP_FILE"

          echo ""
          echo "Backup size:"
          du -h "$BACKUP_FILE"

          echo ""
          echo "Testing backup archive..."

          pg_restore \
            --list "$BACKUP_FILE" > /dev/null

          echo ""
          echo "Backup archive is valid."


      # ==========================================
      # 7. Upload backup to Neon Object Storage
      # ==========================================
      - name: Upload backup to Neon Object Storage
        run: |
          BACKUP_FILE=$(find backup -name "*.dump" -type f | head -n 1)

          FILE_NAME=$(basename "$BACKUP_FILE")

          echo "=========================================="
          echo "Uploading backup"
          echo "=========================================="

          echo "File:"
          echo "$FILE_NAME"

          echo ""
          echo "Bucket:"
          echo "$S3_BUCKET"

          aws s3 cp \
            "$BACKUP_FILE" \
            "s3://$S3_BUCKET/$FILE_NAME" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" \
            --region "$AWS_REGION"

          echo ""
          echo "Upload completed."


      # ==========================================
      # 8. Verify upload
      # ==========================================
      - name: Verify upload
        run: |
          BACKUP_FILE=$(find backup -name "*.dump" -type f | head -n 1)

          FILE_NAME=$(basename "$BACKUP_FILE")

          echo "=========================================="
          echo "Verifying uploaded backup"
          echo "=========================================="

          aws s3 ls \
            "s3://$S3_BUCKET/$FILE_NAME" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" \
            --region "$AWS_REGION"

          echo ""
          echo "=========================================="
          echo "BACKUP UPLOADED SUCCESSFULLY"
          echo "=========================================="

          echo ""
          echo "Backup:"
          echo "$FILE_NAME"

          echo ""
          echo "Bucket:"
          echo "$S3_BUCKET"

          echo ""
          echo "The database backup completed successfully."
